name: Test with tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-id: fake-build-id-12345
          tags: |
            myregistry.example.com/myimage:latest
            myregistry.example.com/myimage:1.0.0

      - name: Assert action ran and failed gracefully (no real Depot build available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Depot build ID)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (possibly a no-op path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
